# Production HTTPS edge for a native (Docker-free) server deployment.
# Install as /etc/nginx/conf.d/sharakat.conf; replace server_name and the
# certificate paths (e.g. issued and renewed by certbot / ACME).
# The API listens on 127.0.0.1:8000 (deploy/systemd/sharakat-api.service) and
# trusts X-Forwarded-* only from this proxy (FORWARDED_ALLOW_IPS=127.0.0.1).

upstream sharakat_api { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name platform.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platform.example.org;

    ssl_certificate     /etc/letsencrypt/live/platform.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Overwrite (never append) forwarded headers at the public edge.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Static UI assets straight from the release; revalidated on every load so a
    # frontend-only release is picked up immediately (same policy as before).
    location /static/ {
        root /opt/sharakat/current/app;
        expires -1;
        try_files $uri =404;
    }

    location = /api/export.xlsx { proxy_pass http://sharakat_api; proxy_read_timeout 240s; }
    location / { proxy_pass http://sharakat_api; expires -1; }
}
