name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "31 4 * * 1"
jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alahsa_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d alahsa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: sqlite:///./ci-tests.db
      ENVIRONMENT: test
      SYNC_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt ruff pip-audit
      - name: Backend lint
        run: ruff check app migrations tests --select E9,F63,F7,F82
      - name: Python tests (offline fixtures)
        run: pytest -q
      - name: JavaScript syntax check
        run: node --check app/static/app.js
      - name: Security dependency scan
        run: pip-audit
      - name: Clean PostgreSQL migration and single-head check
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci-only@localhost:5432/alahsa_ci
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
      - name: Native runtime lint
        run: ruff check sharakat_runtime scripts/native --select E9,F63,F7,F82,F401
      - name: Validate systemd units
        run: systemd-analyze verify --man=no deploy/systemd/*.service deploy/systemd/*.target || true

  # Docker-free runtime on every supported OS: unit tests, then a real
  # install -> start -> login -> export -> restart -> stop cycle.
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: sqlite:///./ci-tests.db
      ENVIRONMENT: test
      SYNC_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Runtime and platform-sensitive unit tests
        run: python -m pytest -q tests/test_native_runtime.py tests/test_export_storage.py tests/test_production_security.py
      - name: Redis for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl disable --now redis-server
      - name: Redis for macOS
        if: runner.os == 'macOS'
        run: brew install redis
      - name: End-to-end smoke test (no Docker)
        env:
          ENVIRONMENT: ""
          DATABASE_URL: ""
        run: python scripts/native/smoke_test.py
