name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "31 4 * * 1"
jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alahsa_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d alahsa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: sqlite:///./ci-tests.db
      ENVIRONMENT: test
      SYNC_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt ruff pip-audit
      - name: Backend lint
        run: ruff check app migrations tests --select E9,F63,F7,F82
      - name: Python tests (offline fixtures)
        run: pytest -q
      - name: JavaScript syntax check
        run: node --check app/static/app.js
      - name: Security dependency scan
        run: pip-audit
      - name: Clean PostgreSQL migration and single-head check
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci-only@localhost:5432/alahsa_ci
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
      - name: Build API, worker, scheduler image
        run: docker build -t alahsa-platform:ci .
      - name: Build frontend image
        run: docker build -f frontend.Dockerfile -t alahsa-frontend:ci .
