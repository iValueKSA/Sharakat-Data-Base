name: alahsa-production-reference
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private PostgreSQL service}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private PostgreSQL service}
      STAGING_DATABASE_NAME: ${STAGING_DATABASE_NAME:-}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL with authentication}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY from secret manager}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the externally served HTTPS URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set exact HTTPS origins}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.31.240.10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set initial administrator email}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set one-time initial password}
      BACKUP_DIR: /backups
    volumes: [backups:/backups]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=source_sync,maintenance,notifications", "--concurrency=4"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      SOURCE_JOB_TIMEOUT_SECONDS: ${SOURCE_JOB_TIMEOUT_SECONDS:-1800}
      BACKUP_DIR: /backups
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
    volumes: [backups:/backups]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    stop_grace_period: 2m
    restart: unless-stopped
  scheduler:
    build: .
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"]
    networks:
      default:
        ipv4_address: ${FRONTEND_CONTAINER_IP:-172.31.240.10}
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  backups:
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_NETWORK_SUBNET:-172.31.240.0/24}
